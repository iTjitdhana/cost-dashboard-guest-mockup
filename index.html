      }).join("")
      document.getElementById("cards").innerHTML = view.map((item) => {
        return '<button class="mcard ' + rowClass(item) + '" data-id="' + item.id + '" type="button"><div class="mhead"><div class="sq">' + item.jobSequence + '</div><div style="flex:1;min-width:0"><div class="' + nameClass(item) + '">' + item.jobName + '</div><div class="tiny muted">' + [item.jobCode, item.operators.join(", ")].filter(Boolean).join(" · ") + "</div>" + (item.currentStepName ? '<div class="tiny">ขั้นตอนล่าสุด: ' + item.currentStepName + "</div>" : "") + "<div>" + jobBadges(item) + '</div></div><div>' + totalCell(item) + '</div></div><div class="meta">' + pills(item) + "<span>" + outputText(item) + "</span><span>" + timeCell(item) + "</span>" + (hasRm(item) ? '<span class="' + (shownYield(item) >= 75 ? "green" : "redt") + '">Yield ' + shownYield(item).toFixed(1) + "%</span>" : "") + "<span>RM " + money(item.materialCost) + "</span><span>LM " + money(item.laborCost) + "</span>" + reliabilityPill(item.costReliabilityPercent) + (item.timerStatus !== "ok" ? timerPill(item.timerStatus) : "") + "</div></button>"
      }).join("")
    }
    function paintKpis(items) {
      const costItems = items.filter((item) => !item.isCancelled)
      const cancelled = items.length - costItems.length
      const total = costItems.reduce((sum, item) => sum + (item.totalCost || 0), 0)
      const rm = costItems.reduce((sum, item) => sum + (item.materialCost || 0), 0)
      const lm = costItems.reduce((sum, item) => sum + (item.laborCost || 0), 0)
      const saved = costItems.filter((item) => item.costSource === "saved").reduce((sum, item) => sum + (item.totalCost || 0), 0)
      const estimated = costItems.filter((item) => item.costSource === "estimated" && item.totalCost != null).reduce((sum, item) => sum + item.totalCost, 0)
      const comparable = costItems.filter((item) => item.totalCost != null && item.standardTotalCost != null)
      const comparableActual = comparable.reduce((sum, item) => sum + item.totalCost, 0)
      const comparableStandard = comparable.reduce((sum, item) => sum + item.standardTotalCost, 0)
      const yields = costItems.map(shownYield).filter((value) => value != null)
      const avg = yields.length ? yields.reduce((sum, value) => sum + value, 0) / yields.length : null
      const complete = costItems.filter((item) => item.costReliabilityPercent === 100).length
      const warn = costItems.filter((item) => item.timerStatus === "warn").length
      const allComplete = costItems.length > 0 && complete === costItems.length
      document.getElementById("kpis").innerHTML =
        '<div class="card"><p class="xs muted">ต้นทุนรวมวันนี้</p><p class="big">' + (total > 0 ? money(total) : "—") + '</p><p class="tiny muted">RM ' + money(rm > 0 ? rm : null) + " · LM " + money(lm > 0 ? lm : null) + '</p><p class="tiny"><span class="sky">จริง ' + money(saved > 0 ? saved : null) + '</span> · <span class="amber">ประมาณการ ' + money(estimated > 0 ? estimated : null) + "</span>" + (cancelled ? ' · <span class="redt">ยกเลิก ' + cancelled + " งาน</span>" : "") + "</p>" + (comparable.length ? '<p class="tiny muted" style="margin-top:6px;padding-top:6px;border-top:1px solid #e4e4e7">เทียบมาตรฐาน (' + comparable.length + " งาน): จริง " + money(comparableActual) + " · มาตรฐาน " + money(comparableStandard) + "</p>" : "") + "</div>" +
        '<div class="card"><p class="xs muted">Yield เฉลี่ย</p><p class="big ' + (avg == null ? "muted" : avg >= 75 ? "green" : "redt") + '">' + (avg == null ? "—" : avg.toFixed(1) + "%") + "</p></div>" +
        '<div class="card"><p class="xs muted">ข้อมูลครบ</p><p class="big ' + (allComplete ? "green" : "amber") + '">' + complete + '<span style="font-size:16px;font-weight:400;color:#71717a">/' + costItems.length + '</span> <span style="font-size:14px;font-weight:400;color:#71717a">รายการ</span></p></div>' +
        '<div class="card" style="' + (warn > 0 ? "background:#fffbeb;border-color:#fde68a" : "background:#f0fdf4;border-color:#bbf7d0") + '"><p class="xs muted">ต้องตรวจสอบ</p><p class="big ' + (warn > 0 ? "amber" : "green") + '">' + (warn > 0 ? warn + ' <span style="font-size:14px;font-weight:400;color:#71717a">รายการ</span>' : "ปกติ") + "</p></div>"
    }
    function checkRow(label, done, required) {
      const mark = !required ? '<span class="muted" style="width:16px;text-align:center">—</span>' : done ? '<span class="ok">✓</span>' : '<span class="bad">✕</span>'
      const tone = required ? (done ? "" : "muted") : "muted"
      return '<div class="line">' + mark + "<span class=\"" + tone + "\">" + label + (required ? "" : ' <span class="tiny">(ไม่บังคับ)</span>') + "</span></div>"
    }
    function openDrawer(item) {
      selectedId = item.id
      document.body.style.overflow = "hidden"
      const need = NEED[item.jobCategory]
      const timeLabel = item.timeSource === "standard" ? "เวลามาตรฐาน" : item.timeSource === "actual" ? "เวลาผลิต" : "เวลา"
      const fields = [
        ["ปริมาณผลผลิต", item.outputQty == null ? "—" : [item.outputQty, item.outputUnit].filter(Boolean).join(" ")],
        [timeLabel, duration(item), item.live ? "time" : ""],
        ...(hasRm(item) ? [["% Yield", item.yieldPercent == null ? "—" : item.yieldPercent.toFixed(1) + "%", "", item.yieldPercent >= 75 ? "green" : "redt"]] : []),
        ["ต้นทุนรวม", money(item.totalCost), item.live ? "total" : "", "", item.costSource === "estimated" ? "ประมาณการ" : item.costSource === "saved" ? "ต้นทุนจริง" : ""],
        ["RM (วัตถุดิบ)", money(item.materialCost)],
        ["LM (ค่าแรง)", money(item.laborCost), item.live ? "lm" : ""],
        ["ผู้ปฏิบัติงาน", item.operators.length ? item.operators.join(", ") : "—"]
      ]
      const notes = []
      if (item.isCancelled) notes.push('<p class="note note-red">งานนี้ถูกยกเลิก — ไม่นำมาคิดต้นทุนรวมวันนี้</p>')
      if (item.costSource === "estimated" && item.totalCost != null) notes.push('<p class="note note-amber">ต้นทุนรวมเป็นประมาณการระหว่างผลิต = RM + LM จากเวลาผลิตจริง</p>')
      if (noStandard(item)) notes.push('<p class="note note-amber">ยังไม่มีเวลามาตรฐานในระบบ</p>')
      if (zeroPrice(item)) notes.push('<p class="note note-amber">มีการตวงสูตรแล้ว แต่ราคาวัตถุดิบยังไม่ครบจาก API</p>')
      if (!item.isCancelled && !tracked(item)) notes.push('<p class="note note-zinc">งานนี้ยังไม่ได้คำนวณต้นทุนชั่วคราว</p>')
      const cmpRows = [
        ["เวลา", hm(item.standardMinutes == null ? null : item.standardMinutes * 60), duration(item), false, item.live ? "time" : ""],
        ["RM", item.standardTotalCost != null ? money(item.materialCost) : "—", money(item.materialCost), false, ""],
        ["LM", money(item.standardLaborCost), money(item.laborCost), false, item.live ? "lm" : ""],
        ["รวม", money(item.standardTotalCost), money(item.totalCost), true, item.live ? "total" : ""]
      ]
      document.getElementById("drawer").innerHTML =
        '<div class="overlay" data-close="1"><div class="panel" role="dialog" aria-modal="true">' +
        '<div class="panel-head"><div><h2 style="margin:0;font-size:16px;line-height:1.35">' + item.jobName + '</h2><p class="tiny muted" style="margin-top:2px">ลำดับ ' + item.jobSequence + " · " + item.jobCode + " · 2 ตุลาคม 2569</p>" + jobBadges(item) + pills(item) + notes.join("") + '</div><button class="x" type="button" data-close="1" aria-label="ปิด">✕</button></div>' +
        '<div class="grid">' + fields.map(([label, value, live, color, hint]) => '<div class="box"><p class="xs muted">' + label + '</p><b class="' + (color || "") + '"' + (live ? ' data-live="' + live + '"' : "") + ">" + value + "</b>" + (hint ? '<p class="tiny amber">' + hint + "</p>" : "") + "</div>").join("") + "</div>" +
        (item.isCancelled ? "" : '<div class="block"><p class="xs muted">ต้นทุนมาตรฐาน เทียบ ต้นทุนจริง</p><table class="cmp"><thead><tr><th></th><th class="num tiny muted">มาตรฐาน</th><th class="num tiny muted">' + (item.costSource === "saved" ? "จริง" : "จริง (เรียลไทม์)") + "</th></tr></thead><tbody>" + cmpRows.map(([label, standard, actual, bold, live]) => '<tr class="' + (bold ? "bold" : "") + '"><td class="muted">' + label + '</td><td class="num">' + standard + '</td><td class="num"' + (live ? ' data-live="' + live + '"' : "") + ">" + actual + "</td></tr>").join("") + "</tbody></table>" + (item.standardTotalCost == null ? '<p class="tiny amber" style="margin-top:8px">ยังไม่มีเวลามาตรฐาน — ยังเทียบต้นทุนไม่ได้</p>' : "") + "</div>") +
        '<div class="block"><p class="xs muted">ความถูกต้องต้นทุน (ตามกลุ่มงาน)</p><div style="margin-top:6px">' + reliabilityPill(item.costReliabilityPercent) + ' <span class="xs muted">' + CATEGORY[item.jobCategory] + "</span></div>" + checkRow("ราคาวัตถุดิบ", item.hasMaterialWeighing, need.material) + checkRow("กดเวลา", item.hasTimerData, need.timer) + checkRow("บันทึกผลผลิต", item.hasOutputQty, need.output) + "</div>" +
        '<div class="block"><p class="xs muted">ข้อมูลครบ 3 ส่วน (ทุกงาน)</p><div style="margin-top:6px">' + reliabilityPill(Math.round((Number(item.hasMaterialWeighing) + Number(item.hasTimerData) + Number(item.hasOutputQty)) / 3 * 100)) + ' <span class="xs muted">ตวงวัตถุดิบ → กดเวลา → บันทึกผลผลิต</span></div>' + checkRow("ราคาวัตถุดิบ", item.hasMaterialWeighing, true) + checkRow("กดเวลา", item.hasTimerData, true) + checkRow("บันทึกผลผลิต", item.hasOutputQty, true) + "</div>" +
        '<div class="block"><p class="xs muted">สถานะการกดเวลา</p><div style="margin-top:6px">' + timerPill(item.timerStatus) + "</div>" + (item.timerStatus === "warn" ? '<p class="tiny amber" style="margin-top:8px">กรุณาตรวจสอบเวลาที่ใช้ในการผลิต — มีขั้นตอนที่ไม่ได้บันทึกเวลาครบถ้วน</p>' : "") + "</div>" +
        '<p class="sample">แถวตัวอย่างนี้โชว์: ' + item.mockReason + "</p></div></div>"
    }
    function closeDrawer() {
      selectedId = null
      document.body.style.overflow = ""
      document.getElementById("drawer").innerHTML = ""
    }
    function patchLive(items) {
      const live = items.find((item) => item.live)
      if (!live) return
      document.querySelectorAll('[data-live="time"]').forEach((node) => { node.textContent = duration(live) })
      document.querySelectorAll('[data-live="lm"]').forEach((node) => { node.textContent = money(live.laborCost) })
      document.querySelectorAll('[data-live="total"]').forEach((node) => { node.textContent = money(live.totalCost) })
    }
    function render() {
      const items = displayItems()
      paintKpis(items)
      paintList(items)
      if (selectedId) {
        const item = items.find((row) => row.id === selectedId)
        if (item) openDrawer(item)
        else closeDrawer()
      }
    }
    document.getElementById("chips").addEventListener("click", (event) => {
      const key = event.target.closest("[data-filter]")
      if (!key) return
      filter = key.dataset.filter
      render()
    })
    document.querySelector("thead").addEventListener("click", (event) => {
      const cell = event.target.closest("th")
      if (!cell || !cell.dataset.key) return
      const key = cell.dataset.key
      sort = { key, dir: sort.key === key && sort.dir === "asc" ? "desc" : "asc" }
      render()
    })
    document.getElementById("rows").addEventListener("click", (event) => {
      const row = event.target.closest("tr")
      if (!row) return
      openDrawer(displayItems().find((item) => item.id === row.dataset.id))
    })
    document.getElementById("cards").addEventListener("click", (event) => {
      const card = event.target.closest("[data-id]")
      if (!card) return
      openDrawer(displayItems().find((item) => item.id === card.dataset.id))
    })
    document.getElementById("drawer").addEventListener("click", (event) => {
      if (event.target.closest(".panel") && !event.target.closest("[data-close]")) return
      if (event.target.closest("[data-close]") || event.target.classList.contains("overlay")) closeDrawer()
    })
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && selectedId) closeDrawer()
    })
    document.getElementById("reload").addEventListener("click", () => {
      const live = displayItems().find((item) => item.live)
      liveAnchor.at = Date.now()
      liveAnchor.base = live.timeUsedSeconds
      render()
    })
    function tickClock() {
      const items = displayItems()
      const live = items.find((item) => item.live)
      const note = document.getElementById("live-note")
      if (note && live) {
        note.innerHTML = '<span class="dot green"><i></i><b></b></span><span>ลำดับ ' + live.jobSequence + " " + live.jobName + ' กำลังจับเวลา</span><b>' + clock(live.timeUsedSeconds) + "</b><span>ค่าแรง " + money(live.laborCost) + " งานที่จบแล้วแสดงเป็น ชม. น. จึงไม่เดิน</span>"
      }
      patchLive(items)
      paintKpis(items)
    }
    try {
      render()
    } catch (error) {
      document.getElementById("live-note").textContent = "render " + (error && error.message)
    }
    try {
      tickClock()
    } catch (error) {
      document.getElementById("live-note").textContent = "tick " + (error && error.message)
    }
    let lastSecond = -1
    function onFrame(now) {
      const second = Math.floor(now / 1000)
      if (second !== lastSecond) {
        lastSecond = second
        tickClock()
      }
      requestAnimationFrame(onFrame)
    }
    requestAnimationFrame(onFrame)
    setInterval(tickClock, 1000)
  </script>
</body>
</html>
